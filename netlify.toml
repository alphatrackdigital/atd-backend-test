[build]
  command = "node scripts/configure-tracking-audit-brevo.mjs"
  functions = "netlify/functions"
  publish = "public"

[dev]
  port = 9000

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

# --- API routes → Netlify functions ---

[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/blog/admin"
  to = "/.netlify/functions/blog-admin"
  status = 200

[[redirects]]
  from = "/api/blog/admin/:path"
  to = "/.netlify/functions/blog-admin"
  status = 200

[[redirects]]
  from = "/api/blog/:slug"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/api/blog"
  to = "/.netlify/functions/blog"
  status = 200

[[redirects]]
  from = "/api/leads"
  to = "/.netlify/functions/leads"
  status = 200

[[redirects]]
  from = "/api/contacts/admin/read/:id"
  to = "/.netlify/functions/contacts-admin"
  status = 200

[[redirects]]
  from = "/api/contacts/admin/:id"
  to = "/.netlify/functions/contacts-admin"
  status = 200

[[redirects]]
  from = "/api/contacts/admin"
  to = "/.netlify/functions/contacts-admin"
  status = 200

[[redirects]]
  from = "/api/brevo-subscribe"
  to = "/.netlify/functions/brevo-subscribe"
  status = 200

[[redirects]]
  from = "/api/brevo-meeting-webhook"
  to = "/.netlify/functions/brevo-meeting-webhook"
  status = 200

[[redirects]]
  from = "/api/brevo-transactional-webhook"
  to = "/.netlify/functions/brevo-transactional-webhook"
  status = 200

# CORS is emitted by each function after validating the request origin.
